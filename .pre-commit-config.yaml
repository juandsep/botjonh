repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^docs/architecture/.*\.html$ # archify output, byte-exact
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: detect-private-key
      # Changes reach dev and main only through pull requests.
      - id: no-commit-to-branch
        args: [--branch, dev, --branch, main]
      - id: check-added-large-files
        exclude: ^(uv\.lock|docs/architecture/.*\.html)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # frozen: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: 68e8b45440415753fff70a312ece8da92ba85b4a  # frozen: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # Frozen hook revisions are commit SHAs, not secrets.
        exclude: ^(uv\.lock|\.secrets\.baseline|\.pre-commit-config\.yaml)$

  # Second secret scanner, same engine as CI: catches formats detect-secrets misses.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks

  # uv.lock must match pyproject.toml (no drift between local and CI installs).
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 5403c16080c62d2568b9adab14249214641a9d1a  # frozen: 0.12.21
    hooks:
      - id: uv-lock

  # GitHub Actions security: template injection, excessive permissions,
  # unpinned actions, credential persistence.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
