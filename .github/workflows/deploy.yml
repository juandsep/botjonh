name: Deploy

on:
  push:
    # Releases deploy from main; a tag only marks the release (the production
    # environment accepts main only).
    branches: [dev, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation, no service account keys.

env:
  STAGING: ${{ github.ref == 'refs/heads/dev' }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/assistant:${{ github.sha }}

jobs:
  deploy:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/dev' && 'staging' || 'production' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check the required variables
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPO: ${{ vars.GCP_ARTIFACT_REPO }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
          GCP_WEBHOOK_SA: ${{ vars.GCP_WEBHOOK_SA }}
          GCP_WORKER_SA: ${{ vars.GCP_WORKER_SA }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          missing=0
          for name in GCP_PROJECT_ID GCP_REGION GCP_ARTIFACT_REPO GCP_WIF_PROVIDER \
                      GCP_DEPLOY_SA GCP_WEBHOOK_SA GCP_WORKER_SA MLFLOW_TRACKING_URI \
                      BACKUP_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::variable $name is empty; set it before deploying"
              missing=1
            fi
          done
          exit $missing

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE }}

      - name: Deploy the webhook service
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ env.STAGING == 'true' && 'assistant-api-staging' || 'assistant-api' }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --service-account=${{ vars.GCP_WEBHOOK_SA }}
            --memory=512Mi
            --min-instances=0
            --max-instances=2
            --allow-unauthenticated
            --command=uvicorn,assistant.api:app,--host,0.0.0.0,--port,8080,--no-access-log
          env_vars: |
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            UPDATES_TOPIC=${{ env.STAGING == 'true' && 'assistant-updates-staging' || 'assistant-updates' }}
          secrets: |
            WEBHOOK_SECRET_TOKEN=assistant-webhook-secret:latest
            WEBHOOK_PATH=assistant-webhook-path:latest

      - name: Deploy the worker service
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ env.STAGING == 'true' && 'assistant-worker-staging' || 'assistant-worker' }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --service-account=${{ vars.GCP_WORKER_SA }}
            --memory=512Mi
            --min-instances=0
            --max-instances=4
            --no-allow-unauthenticated
            --command=uvicorn,assistant.worker:app,--host,0.0.0.0,--port,8080
          env_vars: |
            GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            BACKUP_BUCKET=${{ vars.BACKUP_BUCKET }}
            MLFLOW_TRACKING_URI=${{ vars.MLFLOW_TRACKING_URI }}
            WORKER_URL=${{ vars.WORKER_URL }}
            WORKER_SA=${{ vars.GCP_WORKER_SA }}
            TASKS_QUEUE=assistant-reminders
            KMS_KEY=projects/${{ vars.GCP_PROJECT_ID }}/locations/${{ vars.GCP_REGION }}/keyRings/botjonh/cryptoKeys/ics-url
            TASKS_LOCATION=${{ vars.GCP_REGION }}
            API_URL=${{ vars.API_URL }}
          secrets: |
            TELEGRAM_BOT_TOKEN=${{ env.STAGING == 'true' && 'assistant-bot-token-staging' || 'assistant-bot-token' }}:latest
            DEEPSEEK_API_KEY=assistant-deepseek-key:latest
